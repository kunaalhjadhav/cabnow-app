# Reverse proxy fronting all three HTTP services behind one domain + TLS
# terminator. Point your DNS/load balancer at this container (or replace it
# with your cloud LB's equivalent path-based routing rules).
#
# Routing:
#   /api/*      -> backend (REST + Swagger docs)
#   /socket.io/ -> backend (Socket.IO websocket upgrade, /tracking namespace)
#   /admin/*    -> admin-dashboard (Next.js)
#   /           -> corporate-portal (Next.js) — swap the default if you'd
#                  rather the admin dashboard be the bare domain root.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 20m;

  upstream backend_upstream {
    server backend:3000;
  }
  upstream admin_upstream {
    server admin-dashboard:3001;
  }
  upstream corporate_upstream {
    server corporate-portal:3002;
  }

  server {
    listen 80;
    server_name _;

    location /api/ {
      proxy_pass http://backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    location /admin/ {
      rewrite ^/admin/?(.*)$ /$1 break;
      proxy_pass http://admin_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://corporate_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
