# Production-shaped compose file: images built/pushed by CI (see
# .github/workflows/ci-cd.yml), an Nginx edge, and no bind-mounted source.
# Postgres/Redis here are still containers for a single-box deployment;
# for real production, point DATABASE_URL / REDIS_URL (in your secrets
# manager, injected as env vars below) at managed services instead
# (RDS/Cloud SQL + ElastiCache/Memorystore) and drop the postgres/redis
# services from this file.
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#   docker compose -f docker-compose.prod.yml exec backend npx prisma migrate deploy

version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data

  backend:
    image: ${REGISTRY:-ghcr.io/your-org}/cab-platform-backend:${IMAGE_TAG:-latest}
    restart: always
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        max_attempts: 5

  admin-dashboard:
    image: ${REGISTRY:-ghcr.io/your-org}/cab-platform-admin-dashboard:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      - backend

  corporate-portal:
    image: ${REGISTRY:-ghcr.io/your-org}/cab-platform-corporate-portal:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - admin-dashboard
      - corporate-portal

volumes:
  postgres_data:
  redis_data:
